name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${$ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  train:                      # job id: train
    runs-on: ubuntu-latest
    needs: test                # only run if the test job succeeded
    steps:
      - uses: actions/checkout@v4
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${$ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build the dataset
        run: python src/make_data.py
      - name: Train and evaluate
        run: python src/train_eval.py
      - name: Quality gate
        run: python src/check_metrics.py --min-recall 0.45

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Promote Model
        run: echo "Promoting model to production..."
